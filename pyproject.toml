[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yumehime"
version = "0.1.0"
description = "Self-hosted Japanese live subtitles"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "sherpa-onnx==2.0.1",
  "psutil>=5.9,<8",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
]

[project.scripts]
livesub = "livesub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
livesub = ["presets/*.json"]
