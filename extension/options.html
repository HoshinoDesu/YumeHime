<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><link rel="icon" href="mark.svg"><title>YumeHime 设置</title></head>
<body class="options"><div class="settings-layout">
<aside class="sidebar"><h1 class="brand-heading"><span class="brand-mark" data-icon="moon"></span>YumeHime</h1><nav aria-label="设置导航">
<a href="#connection-settings"><span data-icon="link"></span><span>连接设置</span></a>
<a href="#subtitle-settings"><span data-icon="type"></span><span>字幕样式</span></a>
<a href="#glossary-settings"><span data-icon="book"></span><span>词库</span></a>
</nav></aside>
<main><form id="settings">
<section class="card" id="connection-settings"><header class="card-header"><h2>连接设置</h2><label class="file-button secondary" for="connection"><span data-icon="upload"></span><span>导入连接配置</span><input id="connection" type="file" accept=".json"></label></header>
<div class="fields"><label class="wide">服务器地址<input name="url" type="url" required placeholder="wss://subtitle.example.com/ws" spellcheck="false"></label>
<label class="wide">网关访问令牌<input name="token" type="password" required autocomplete="off" spellcheck="false"></label>
<label class="wide">翻译模型<input name="model" required spellcheck="false"></label>
<label>界面语言<select name="uiLanguage"><option value="auto">跟随系统</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option></select></label>
<label>目标语言<select name="targetLanguage"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option></select></label>
<label class="wide">本次使用的主播或游戏词库<input name="profiles" placeholder="streamer:arale,game:bandori" spellcheck="false"></label></div></section>
<section class="card" id="subtitle-settings"><header class="card-header"><h2>字幕样式</h2><button id="reset-position" type="button" class="secondary"><span data-icon="reset"></span><span>恢复默认位置</span></button></header>
<div class="appearance-grid"><div class="appearance-fields">
<label><span class="field-title"><span>中文字幕字号</span><output id="font-size-value" for="font-size">32</output></span><input id="font-size" name="fontSize" type="range" min="16" max="64"></label>
<label><span class="field-title"><span>背景不透明度</span><output id="opacity-value" for="caption-opacity">60%</output></span><input id="caption-opacity" name="opacity" type="range" min="0" max="1" step="0.05"></label>
<div class="fields"><label>描边强度<select name="outlineWidth"><option value="0">无</option><option value="1">轻</option><option value="2">标准</option><option value="3">明显</option><option value="4">强</option></select></label>
<label>默认距底部（%）<input name="bottom" type="number" min="2" max="70"></label></div>
<label>字幕更新<select name="subtitleSpeed"><option value="0">实时</option><option value="1000">稳定 · 1 秒</option><option value="2000">稳定 · 2 秒</option><option value="finalOnly">只显示确认结果</option></select></label>
<label class="check"><input name="showJapanese" type="checkbox">显示日文原文</label><label class="check"><input name="positionLocked" type="checkbox">锁定浮层位置</label>
</div><div class="subtitle-preview" aria-label="字幕外观预览"><div class="preview-caption"><div class="ja">今日はちょっと寒いね。</div><div class="zh">今天有点冷呢。</div></div></div></div></section>
<div class="save-bar"><output id="status" aria-live="polite"></output><button type="submit"><span data-icon="save"></span><span>保存设置</span></button></div>
</form>
<section class="card" id="glossary-settings"><header class="card-header"><h2>词库</h2><label class="file-button secondary" for="import"><span data-icon="upload"></span><span>导入 CSV 或 JSON</span><input id="import" type="file" accept=".csv,.json" form="glossary"></label></header>
<form id="glossary"><div class="profile-toolbar"><label>编辑词库<input id="profile" value="global" required spellcheck="false"></label><button id="load" type="button" class="secondary">读取</button></div>
<label>词条（JSON）<textarea id="entries" spellcheck="false">[]</textarea></label>
<div class="actions"><button type="submit"><span data-icon="save"></span><span>保存词库</span></button><button id="export" type="button" class="secondary"><span data-icon="download"></span><span>导出 JSON</span></button></div>
</form><output id="glossary-status" aria-live="polite"></output></section>
</main></div><script src="icons.js"></script><script src="options.js" type="module"></script></body></html>
